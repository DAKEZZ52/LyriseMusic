name: Build LyriseMusic Desktop

on:
  # 只做构建验证，不再随 tag 自动发布。
  # 发布统一走本地：一次 pnpm build，产物同时分发到腾讯云与 GitHub Release，
  # 保证两个渠道拿到同一份二进制（签名私钥只在本地，不会进 CI）。
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    # 只在手动触发时构建验证，不写仓库内容
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ad-hoc Mac builds cannot use Squirrel.Mac automatic installation.
          # Keep src/shared/manualUpdate.ts in manual mode until Developer ID
          # signing is configured; existing ad-hoc installs need a manual migration.
          - os: macos-14
            rust_target: aarch64-apple-darwin
            electron_builder_args: '--mac --arm64 --config.mac.identity=-'
            artifact_name: LyriseMusic-macOS-arm64
            artifact_glob: |
              release/LyriseMusic-*.zip
              release/LyriseMusic-*.dmg
              release/latest-mac.yml
          - os: macos-14
            rust_target: x86_64-apple-darwin
            electron_builder_args: '--mac --x64 --config.mac.identity=-'
            artifact_name: LyriseMusic-macOS-x64
            artifact_glob: |
              release/LyriseMusic-*.zip
              release/LyriseMusic-*.dmg
          - os: windows-latest
            rust_target: ''
            electron_builder_args: '--win --x64'
            artifact_name: LyriseMusic-Windows-x64
            artifact_glob: |
              release/LyriseMusic-*.exe
              release/LyriseMusic-*.exe.blockmap
              release/latest.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/lyrise-audio-capture
            native/lyrise-media-controls
            native/lyrise-platform-adaptor
            native/lyrise-audio-player
            native/lyrise-sqlite-store

      - name: Add Rust cross-compile target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Prepare native build toolchain
        shell: bash
        run: |
          set -e
          if [ "${{ runner.os }}" = "Windows" ]; then
            # ffmpeg 汇编需要 nasm，bindgen 需要 libclang
            choco install nasm -y --no-progress || true
            LLVM_BIN='C:\Program Files\LLVM\bin'
            if [ -d "$LLVM_BIN" ]; then
              echo "$LLVM_BIN" >> "$GITHUB_PATH"
              echo "LIBCLANG_PATH=$LLVM_BIN" >> "$GITHUB_ENV"
            fi
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          fi
          echo "RUST_BACKTRACE=1" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"

      - name: Build native addons
        timeout-minutes: 45
        shell: bash
        run: |
          set -e
          build_addon() {
            local dir="$1"
            echo "=== building $dir ==="
            cd "native/$dir"
            npm install
            if [ -n "${{ matrix.rust_target }}" ]; then
              npx napi build --release --no-const-enum --target ${{ matrix.rust_target }}
            else
              npm run build
            fi
            cd - >/dev/null
          }
          # 串行构建：并行编译多个 ffmpeg 会撑爆 runner 内存，导致失败
          build_addon lyrise-audio-capture
          build_addon lyrise-media-controls
          if [ "${{ runner.os }}" = "Windows" ] || [ "${{ runner.os }}" = "macOS" ]; then
            build_addon lyrise-platform-adaptor
          fi
          build_addon lyrise-audio-player
          build_addon lyrise-sqlite-store

      - name: Verify macOS ffmpeg player linkage
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          addon="native/lyrise-audio-player/lyrise-audio-player.node"
          if [ ! -f "$addon" ]; then
            echo "ERROR: ffmpeg player addon not found: $addon"
            exit 1
          fi

          otool -L "$addon" | tee /tmp/lyrise-audio-player-otool.txt
          if grep -E 'lib(avcodec|avformat|avutil|swresample|mpv).*\.(dylib|so)' /tmp/lyrise-audio-player-otool.txt; then
            echo "ERROR: ffmpeg player addon unexpectedly links to system FFmpeg/mpv libraries"
            exit 1
          fi

      - name: Cache server node_modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node20-server-nm-${{ hashFiles('server/package-lock.json') }}

      - name: Install server runtime dependencies
        working-directory: server
        shell: bash
        run: |
          # server 是 vendored 的酷狗接口服务（不是子模块），其 package-lock.json 常与 package.json 不同步，
          # 且 devDependencies(tsdown) 与 typescript@4.x 存在 peer 冲突。
          # 运行时只需 --omit=dev 的依赖，故统一用 npm install + --legacy-peer-deps。
          # 上一步的 pnpm install 会以 workspace 成员身份在 server 内建立符号链接结构，
          # 必须先清除，保证 electron-builder 打包的是纯 npm 扁平结构。
          rm -rf node_modules
          npm install --omit=dev --no-audit --no-fund --legacy-peer-deps

      - name: Remove server test files
        working-directory: server
        shell: bash
        run: find module -name '*.test.js' -delete

      - name: Configure Windows Defender exclusion
        if: runner.os == 'Windows'
        shell: pwsh
        run: 'Add-MpPreference -ExclusionPath "$env:RUNNER_WORKSPACE"'

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package.json') }}

      - name: Build desktop app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: |
          pnpm exec vue-tsc --noEmit && pnpm exec vite build
          pnpm exec electron-builder ${{ matrix.electron_builder_args }} --publish never

      - name: Verify packaged native addons
        shell: bash
        run: |
          set -e
          addons=(lyrise-audio-capture lyrise-media-controls lyrise-audio-player lyrise-sqlite-store)
          if [ "${{ runner.os }}" = "Windows" ] || [ "${{ runner.os }}" = "macOS" ]; then
            addons+=(lyrise-platform-adaptor)
          fi
          for addon in "${addons[@]}"; do
            matches=$(find release \( \
              -path "*/resources/native/${addon}.node" -o \
              -path "*/Contents/Resources/native/${addon}.node" \
            \) -type f -print)
            if [ -z "$matches" ]; then
              echo "ERROR: packaged native addon not found: ${addon}.node"
              find release -maxdepth 4 -type f -name '*.node' -print
              exit 1
            fi
            printf 'Packaged native addon found: %s\n' "$matches"
          done

      - name: Verify macOS media permission and signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          app_path=$(find release -maxdepth 2 -type d -name '*.app' -print -quit)
          if [ -z "$app_path" ]; then
            echo "ERROR: packaged macOS app not found"
            exit 1
          fi

          plist="$app_path/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSAudioCaptureUsageDescription' "$plist" >/dev/null
          codesign -d --entitlements :- "$app_path" > /tmp/lyrise-entitlements.plist
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' /tmp/lyrise-entitlements.plist >/dev/null
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Verify bundled Windows executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e

          if [ "${{ runner.arch }}" = "ARM64" ]; then
            app_exe="release/win-arm64-unpacked/LyriseMusic.exe"
          else
            app_exe="release/win-unpacked/LyriseMusic.exe"
          fi

          if [ ! -f "$app_exe" ]; then
            echo "ERROR: bundled app executable not found: $app_exe"
            echo "=== release directories ==="
            find release -maxdepth 2 -type d -print
            echo "=== executable files ==="
            find release -maxdepth 3 -type f -name '*.exe' -print
            exit 1
          fi

          echo "bundled app executable found: $app_exe"

      - name: Verify Windows update metadata
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e

          metadata="release/latest.yml"
          if [ ! -f "$metadata" ]; then
            echo "ERROR: Windows update metadata not found: $metadata"
            find release -maxdepth 2 -type f -print
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const yaml = require('js-yaml');

          const metadataPath = path.join('release', 'latest.yml');
          const info = yaml.load(fs.readFileSync(metadataPath, 'utf8'));
          const file = info && Array.isArray(info.files) ? info.files[0] : null;

          if (!file || typeof file.url !== 'string' || file.url.length === 0) {
            throw new Error('latest.yml is missing files[0].url');
          }
          if (typeof file.sha512 !== 'string' || file.sha512.length === 0) {
            throw new Error('latest.yml is missing files[0].sha512');
          }
          if (!Number.isFinite(file.size) || file.size <= 0) {
            throw new Error('latest.yml is missing a positive files[0].size');
          }

          const artifactPath = path.join('release', file.url);
          if (!fs.existsSync(artifactPath)) {
            throw new Error(`latest.yml points to a missing installer: ${artifactPath}`);
          }

          const actualSize = fs.statSync(artifactPath).size;
          if (actualSize !== file.size) {
            throw new Error(`latest.yml size mismatch: expected ${file.size}, got ${actualSize}`);
          }

          console.log(`Windows update metadata verified: ${file.url} (${file.size} bytes)`);
          NODE

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 7
